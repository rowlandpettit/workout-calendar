[feeds.lifting]
name = "Rowland Fitness - Lifting"
filename = "lifting.ics"
description = "Weekday gym sessions at 7:00 AM local: one easy mile, 30 minutes of lifting, then sauna."
color = "#1f7a5c"

[feeds.cardio]
name = "Rowland Fitness - Cardio"
filename = "cardio.ics"
description = "Retired feed. The weekday mile is part of each gym session."
color = "#c94f2d"

[[events]]
feed = "lifting"
id = "upper-a"
summary = "Gym: Chest + Mile + Sauna"
day = "MO"
start = "07:00"
duration_minutes = 60
location = "Gym"
categories = ["FITNESS", "LIFTING", "CHEST"]
description = """
7:00-8:00 local gym block. Run one easy mile first, lift for 30 minutes, then sauna for about 10 minutes. Leave time to cool down and hydrate; shower time may extend the block.

Chest lift:
- Barbell or machine bench press: 3 x 6-10.
- Incline dumbbell press: 2 x 8-12.
- Cable fly: 2 x 12-15.

Warm up with one light bench set. Rest about 60-90 seconds. Keep 1-2 clean reps in reserve. Add a little weight only after all sets reach the top of their range.

Sauna comes after lifting. Skip it if dizzy, ill, or dehydrated.
"""

