[feeds.lifting]
name = "Rowland Fitness - Lifting"
filename = "lifting.ics"
description = "Weekday gym sessions at 6:15 AM local: one easy mile, a short lift, then an optional 15-minute sauna."
color = "#1f7a5c"

[feeds.cardio]
name = "Rowland Fitness - Cardio"
filename = "cardio.ics"
description = "Retired feed. The weekday mile is part of each gym session."
color = "#c94f2d"

[[events]]
feed = "lifting"
id = "upper-a"
summary = "Gym: Chest + Mile + Sauna"
day = "MO"
start = "06:15"
duration_minutes = 45
location = "Gym"
categories = ["FITNESS", "LIFTING", "CHEST"]
description = """
6:15-6:27: Run one easy mile. Do not race the clock.
6:27-6:44: Chest, with one light first set:
- Bench or machine chest press: 3 x 6-10.
- Incline dumbbell press: 2 x 8-12.
Kettlebell swaps: double floor press 3 x 8-12; push-ups 2 x 8-15. Use one bell if two are awkward.
6:44-6:45: Move to sauna.
6:45-7:00: Sauna if warm and available; then head upstairs to shower and hydrate.

Keep 2-3 clean reps in reserve. If the mile takes longer, trim a lifting set instead of speeding up. Skip sauna if dizzy, ill, or dehydrated.
"""

