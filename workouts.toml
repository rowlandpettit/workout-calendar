description = """
7:00-8:00 local gym block. Run one easy mile first, lift for 30 minutes, then sauna for about 10 minutes. Leave time to cool down and hydrate; shower time may extend the block.

Arms lift, alternating biceps and triceps:
- Cable curl: 3 x 10-12.
- Rope triceps pressdown: 3 x 10-12.
- Dumbbell hammer curl: 2 x 10-12.
- Overhead cable triceps extension: 2 x 10-12.

Alternate each curl with the following triceps move. Rest about 45-60 seconds between pairs. Keep 1-2 clean reps in reserve. Add a little weight only after all sets reach the top of their range.

Sauna comes after lifting. Skip it if dizzy, ill, or dehydrated.
"""

