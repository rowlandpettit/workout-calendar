[feeds.lifting]
name = "Rowland Fitness - Lifting"
filename = "lifting.ics"
description = "Weekday strength with independent Weights, DB only, and KB only paths; Saturday long run; Sunday swim."
color = "#1f7a5c"

[feeds.cardio]
name = "Rowland Fitness - Cardio"
filename = "cardio.ics"
description = "Retired feed. Subscribe to Lifting or All Workouts."
color = "#c94f2d"

[[events]]
feed = "lifting"
id = "upper-a"
summary = "Chest"
day = "MO"
start = "06:15"
duration_minutes = 30
location = "Gym"
categories = ["FITNESS", "LIFTING", "CHEST"]
description = """
Weights
Warm-up: 1 x 15–20 light on the first lift, then ramp-up sets.
Bench press — 4 x 4–6
Incline DB press — 2 x 6–10
Cable fly — 2 x 10–15
Kneeling rope cable crunch — 2 x 8–12

DB only
Warm-up: 1 x 15–20 light on the first lift, then ramp-up sets.
DB bench or floor press — 4 x 6–8
DB squeeze floor press — 2 x 8–12
Push-up — 2 x 8–15
DB weighted crunch — 2 x 8–12

KB only
Warm-up: 1 x 15–20 light on the first lift, then ramp-up sets.
KB floor press — 4 x 6–8/side
KB crush floor press — 2 x 8–12
Push-up — 2 x 8–15
KB weighted crunch — 2 x 8–12

Progress each path separately: finish all sets at top reps/steps with 1–2 reps left, then add the smallest load and restart at low reps. Otherwise keep the load and build reps.
Crunches: hold DB/KB at chest. Push-ups: build reps, then use a harder variation.
Rest 2 min on the first lift; 60–90 sec on the others.
Week 4: use 2 / 1 / 1 / 1 working sets; repeat the 4-week cycle.
"""

