[feeds.lifting]
name = "Rowland Fitness - Lifting"
filename = "lifting.ics"
description = "30-minute weekday strength sessions. Choose one complete path: Weights, DB only, or KB only. Progress each path separately."
color = "#1f7a5c"

[feeds.cardio]
name = "Rowland Fitness - Cardio"
filename = "cardio.ics"
description = "Retired feed. Subscribe to Lifting or All Workouts."
color = "#c94f2d"

[[events]]
feed = "lifting"
id = "upper-a"
summary = "Chest"
day = "MO"
start = "06:15"
duration_minutes = 30
location = "Gym"
categories = ["FITNESS", "LIFTING", "CHEST"]
description = """
Pick one path. 30 min. Working sets:

Weights
Bench press — 3 x 4–6
Incline DB press — 3 x 6–10
Cable fly — 2 x 10–15
Kneeling rope cable crunch — 2 x 8–12

DB only
DB bench or floor press — 3 x 6–8
DB squeeze floor press — 3 x 8–12
Push-up — 2 x 8–15
DB weighted crunch — 2 x 8–12

KB only
KB floor press — 3 x 6–8/side
KB crush floor press — 3 x 8–12
Push-up — 2 x 8–15
KB weighted crunch — 2 x 8–12

Progress each path separately: finish all sets at top reps/steps with 1–2 reps left, then add the smallest load and restart at low reps. Otherwise keep the load and build reps.
Crunches: hold DB/KB at chest. Push-ups: build reps, then use a harder variation.
Warm up first. Rest 2 min on the first lift; 60–90 sec on the others.
Week 4: use 2 / 1 / 1 / 1 working sets; repeat the 4-week cycle.
"""

